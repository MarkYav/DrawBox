      - name: normalized-coordinate-system
        description: >
          All stroke data is stored in [0..1] space and scaled to pixel space on render.
          Normalization: point.div(canvasSize). Denormalization: point.times(canvasSize).
          Applies to both points and strokeWidth in PathWrapper.
          See: DrawController.kt:93, :119, :147.
